<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TorqueMedic — feature graphic</title>
    <!--
      Source for store/play/feature-graphic-1024x500.png.
      Served by the dev server at /store/play/feature-graphic.html and captured at
      a 1024x500 viewport. Play crops the edges, so all content stays centred.
    -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1024px; height: 500px; overflow: hidden; }
      body {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background:
          radial-gradient(900px 520px at 12% 20%, rgba(46, 230, 168, 0.16), transparent 62%),
          radial-gradient(760px 420px at 88% 92%, rgba(70, 184, 245, 0.14), transparent 60%),
          linear-gradient(160deg, #0a0e13, #121c26);
        color: #e9f0f7;
        display: flex;
        align-items: center;
        gap: 52px;
        padding: 56px 72px;
        position: relative;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
        background-size: 64px 64px;
        mask-image: radial-gradient(circle at 50% 45%, #000, transparent 78%);
        opacity: 0.5;
      }
      .card {
        position: relative;
        width: 248px;
        height: 248px;
        border-radius: 56px;
        display: grid;
        place-items: center;
        background: linear-gradient(155deg, #101820, #0b1117);
        border: 1px solid rgba(148, 170, 190, 0.16);
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }
      .copy { position: relative; }
      h1 { font-size: 76px; line-height: 1; letter-spacing: -2.5px; font-weight: 800; }
      h1 span { color: #2ee6a8; }
      .tag { margin-top: 18px; font-size: 28px; line-height: 1.35; color: #9db1c4; max-width: 560px; }
      .pills { display: flex; gap: 12px; margin-top: 30px; }
      .pill {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        color: #cfe0ee;
        border: 1px solid rgba(148, 170, 190, 0.28);
        border-radius: 999px;
        padding: 9px 16px;
        background: rgba(255, 255, 255, 0.03);
      }
      .pill b { color: #2ee6a8; }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="card">
      <svg viewBox="0 0 512 512" width="236" height="236" xmlns="http://www.w3.org/2000/svg">
        <circle cx="256" cy="256" r="150" fill="none" stroke="#1d2b38" stroke-width="26" />
        <path d="M256 106a150 150 0 0 1 129.9 75" fill="none" stroke="#2ee6a8" stroke-width="26" stroke-linecap="round" />
        <path d="M126 331a150 150 0 0 0 62 54" fill="none" stroke="#ffb020" stroke-width="26" stroke-linecap="round" />
        <line x1="256" y1="256" x2="196" y2="196" stroke="#e8eef5" stroke-width="18" stroke-linecap="round" />
        <circle cx="256" cy="256" r="26" fill="#e8eef5" />
        <g fill="#8ba0b4">
          <circle cx="170" cy="256" r="9" />
          <circle cx="342" cy="256" r="9" />
          <circle cx="256" cy="170" r="9" />
        </g>
      </svg>
    </div>
    <div class="copy">
      <h1>Torque<span>Medic</span></h1>
      <p class="tag">Read the codes.<br />See the data. Fix it right.</p>
      <div class="pills">
        <div class="pill"><b>OBD-II</b> diagnostics</div>
        <div class="pill">Bluetooth &amp; Wi-Fi</div>
      </div>
    </div>
  </body>
</html>
