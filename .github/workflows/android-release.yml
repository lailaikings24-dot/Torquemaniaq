name: Android release bundle

# Produces a signed Play upload bundle for every version tag (v1.0.0, v2.1.0…).
# A manual run (Actions → Android release bundle → Run workflow) builds the same
# bundle unsigned, so the CI toolchain can be checked without signing secrets.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of the upload keystore .jks
#   ANDROID_KEYSTORE_PASSWORD  store password
#   ANDROID_KEY_ALIAS          key alias (usually "upload")
#   ANDROID_KEY_PASSWORD       key password
#
# Bump versionCode in android/app/build.gradle before tagging: Play rejects a
# bundle that reuses a version code already uploaded to a track.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Signed AAB
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tag
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          # AGP 8.9 defaults to build-tools 35.0.0; API 36 needs platform 36.
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build the web app and sync it into Android
        run: npm run android:sync

      - name: Require signing secrets
        if: github.event_name == 'push'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Add the four Android signing secrets before tagging."
            exit 1
          fi

      - name: Write the keystore and signing properties
        if: github.event_name == 'push'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties

      - name: Build the App Bundle
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --console=plain

      - name: Record build facts in the job summary
        working-directory: android
        run: |
          set -euo pipefail
          AAB=app/build/outputs/bundle/release/app-release.aab
          ASSET=$(unzip -Z1 "$AAB" | grep -E '^base/assets/public/assets/index-.*\.js$' | head -1)
          ASSET_HASH=$(unzip -p "$AAB" "$ASSET" | sha256sum | cut -d' ' -f1)
          AAB_HASH=$(sha256sum "$AAB" | cut -d' ' -f1)
          VERSION_CODE=$(grep -oE 'versionCode [0-9]+' app/build.gradle | awk '{print $2}')
          VERSION_NAME=$(grep -oE 'versionName "[^"]+"' app/build.gradle | cut -d'"' -f2)
          {
            echo '## Android bundle'
            echo ''
            echo '| Field | Value |'
            echo '| --- | --- |'
            echo "| Web asset | \`$(basename "$ASSET")\` |"
            echo "| Web asset SHA-256 | \`$ASSET_HASH\` |"
            echo "| versionCode | \`$VERSION_CODE\` |"
            echo "| versionName | \`$VERSION_NAME\` |"
            echo "| AAB SHA-256 | \`$AAB_HASH\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the bundle is signed
        if: github.event_name == 'push'
        working-directory: android
        run: |
          set -euo pipefail
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tee /tmp/signature.txt
          grep -q "jar verified" /tmp/signature.txt

      - name: Verify the bundle is unsigned (dry run)
        if: github.event_name == 'workflow_dispatch'
        working-directory: android
        run: |
          set -euo pipefail
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tee /tmp/signature.txt
          grep -q "jar is unsigned" /tmp/signature.txt

      - name: Upload the AAB
        uses: actions/upload-artifact@v4
        with:
          name: torquemedic-${{ github.event_name == 'push' && github.ref_name || format('dry-run-{0}', github.run_number) }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        run: rm -f android/keystore.properties "$RUNNER_TEMP/upload-keystore.jks"
